name: Publish Docker Image

on:
  push:
    branches: [ main ]  
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Obtiene el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Inicia sesión en Docker Hub usando los Secrets que configuraste
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  
          password: ${{ secrets.DOCKER_PASSWORD }}   

      # 3. Imagen (push) a Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./auth_services  # Ruta a tu servicio de autenticación
          push: true 
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/back_under_tango_auth:latest
            ${{ secrets.DOCKER_USERNAME }}/back_under_tango_auth:${{ github.sha }}