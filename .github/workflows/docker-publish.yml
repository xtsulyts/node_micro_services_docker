name: Publish Services to Docker Hub

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Build and Push Auth Service
        run: |
          echo "=== CONSTRUYENDO AUTH SERVICE ==="
          docker build -t ${{ secrets.DOCKER_USERNAME }}/node_micro_services_auth_services:latest ./auth_services
          docker push ${{ secrets.DOCKER_USERNAME }}/node_micro_services_auth_services:latest
          echo "✅ Auth Service subido a: ${{ secrets.DOCKER_USERNAME }}/node_micro_services_auth_services:latest"

      - name: Build and Push Gateway Service
        run: |
          echo "=== CONSTRUYENDO GATEWAY SERVICE ==="
          # Nombre CONSISTENTE con el patrón
          docker build -t ${{ secrets.DOCKER_USERNAME }}/node_micro_services_gateway:latest ./gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/node_micro_services_gateway:latest
          echo "✅ Gateway Service subido a: ${{ secrets.DOCKER_USERNAME }}/node_micro_services_gateway:latest"