name: Publish Services to Docker Hub

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug estructura
        run: |
          echo "=== VERIFICANDO ESTRUCTURA ==="
          echo "Directorio actual:"
          pwd
          echo "Contenido:"
          ls -la
          echo "¿Existe auth_services/?"
          ls -la auth_services/ || echo "No existe"
          echo "¿Existe gateway/?"
          ls -la gateway/ || echo "No existe"

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Build and Push Auth Service
        run: |
          echo "=== CONSTRUYENDO AUTH SERVICE ==="
          docker build -t ${{ secrets.DOCKER_USERNAME }}/node_services_auth:latest ./auth_services
          docker push ${{ secrets.DOCKER_USERNAME }}/node_services_auth:latest
          echo "✅ Auth Service subido"

      - name: Build and Push Gateway Service
        run: |
          echo "=== CONSTRUYENDO GATEWAY SERVICE ==="
          docker build -t ${{ secrets.DOCKER_USERNAME }}/node_services_gateway:latest ./gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/node_services_gateway:latest
          echo "✅ Gateway Service subido"