name: Publish to Docker Hub

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Secrets
        run: |
          echo "--- INICIO DEBUG ---"
          USERNAME="${{ secrets.DOCKER_USERNAME }}"
          PASSWORD="${{ secrets.DOCKER_PASSWORD }}"
          echo "USERNAME (raw): '${USERNAME}'"
          echo "PASSWORD length: ${#PASSWORD}"
          # Mostrar primeros y últimos caracteres (sin exponer todo el token)
          if [ -n "$PASSWORD" ]; then
            echo "PASSWORD start: ${PASSWORD:0:5}..."
            echo "PASSWORD end: ...${PASSWORD: -5}"
          else
            echo "PASSWORD está VACÍO"
          fi
          echo "--- FIN DEBUG ---"

      - name: Login to Docker Hub
        run: |
          # Guardar y limpiar el token
          DOCKER_PASSWORD="${{ secrets.DOCKER_PASSWORD }}"
          # Eliminar espacios y saltos de línea
          CLEAN_PASSWORD=$(echo -n "$DOCKER_PASSWORD" | tr -d '[:space:]')
          
          echo "$CLEAN_PASSWORD" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/node_micro_services_auth_services:latest ./auth_services

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/node_micro_services_auth_services:latest