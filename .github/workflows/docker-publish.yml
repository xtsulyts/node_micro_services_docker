name: Publish Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4
        
      # 2. Verificar estructura (opcional, para debugging)
      - name: Verify Dockerfile exists
        run: |
          echo "Verificando Dockerfile en ./auth_services..."
          if [ -f "./auth_services/Dockerfile" ]; then
            echo "✅ Dockerfile encontrado"
            echo "Contenido del directorio auth_services:"
            ls -la ./auth_services/
          else
            echo "❌ ERROR: No se encuentra Dockerfile en ./auth_services"
            exit 1
          fi
          
      # 3. Login a Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      # 4. Build y push
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./auth_services
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/node_micro_services_auth_services:latest
            ${{ secrets.DOCKER_USERNAME }}/node_micro_services_auth_services:${{ github.sha }}
          # Cache opcional para builds más rápidos
          cache-from: type=gha
          cache-to: type=gha,mode=max